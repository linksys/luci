name: AI Code Review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      code_review:
        description: 'Run code review'
        required: false
        default: true
        type: boolean
      upstream_check:
        description: 'Check upstream references'
        required: false
        default: true
        type: boolean
      pr_number:
        description: 'PR number to review (leave empty for current branch)'
        required: false
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    if: contains(github.event.pull_request.labels.*.name, 'ai-code-review') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout luci repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ci-templates
        uses: actions/checkout@v4
        with:
          repository: linksys/ci-templates
          token: ${{ secrets.CI_TEMPLATES_TOKEN }}
          path: .ci-templates
          ref: main

      - name: Run AI Code Review
        uses: ./.ci-templates/.github/actions/ai-review
        with:
          token: ${{ secrets.CI_TEMPLATES_TOKEN }}
          aws_token: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          pr_number: ${{ github.event.inputs.pr_number }}
          code_review: ${{ github.event.inputs.code_review || 'true' }}
          upstream_check: ${{ github.event.inputs.upstream_check || 'true' }}
          aws_region: us-east-2
          ref: main
